<!DOCTYPE html>

<html lang="en">
    <head>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js" integrity="sha384-oBqDVmMz9ATKxIep9tiCxS/Z9fNfEXiDAYTujMAeBAsjFuCZSmKbSSUnQlmh/jp3" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.min.js" integrity="sha384-cuYeSxntonz0PPNlHhBs68uyIAVpIIOZZ5JqeqvYYIcEL727kskC66kF92t6Xl2V" crossorigin="anonymous"></script>
        <link href="styles.css" rel="stylesheet">
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Control de Lectura</title>
        <script>
            document.addEventListener('DOMContentLoaded', function() {

                let incorrects = document.querySelectorAll('.incorrect');

                for (incorrect of incorrects) {
                    incorrect.addEventListener('click', function() {
                        incorrect.style.backgroundColor = 'Red';
                        incorrect.parentElement.querySelector('.feedback').innerHTML = 'Incorrecto';
                    });
                }

                let correct = document.querySelector('.correct')

                correct.addEventListener('click', function() {
                    correct.style.backgroundColor = 'Green';
                    correct.parentElement.querySelector('.feedback').innerHTML = '¡Correcto!';
                });

                document.querySelector('#check').addEventListener('click', function() {
                    let input = document.querySelector('input');

                    if (input.value === 'Psicología') {
                        input.style.backgroundColor = 'green';
                        input.parentElement.querySelector('.feedback').innerHTML = '¡Correcto!';
                    } else {
                        input.style.backgroundColor = 'red';
                        input.parentElement.querySelector('.feedback').innerHTML = 'Incorrecto';
                    }
                });
            });
        </script>
    </head>

    <body>
        <div>
            <div class="header">
                <h2>Control de Lectura</h2>
            </div>

        <div class="container">
            <div class="accordion" id="accordionExample">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingOne">
                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseOne" aria-expanded="true" aria-controls="collapseOne">
                        Parte 1: Selección Múltiple
                    </button>
                    </h2>
                    <div id="collapseOne" class="accordion-collapse collapse show" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <strong>
                            <p>¿A qué universidad fue Nathalie Otárola?</p>
                            <button class="incorrect">Universidad de Chile</button>
                            <button class="correct">Pontificia Universidad Católica</button>
                            <button class="incorrect">Universidad Técnica Federico Santa María</button>
                            <p class="feedback"></p>
                        </strong>
                    </div>
                    </div>
                </div>
                <div class="accordion-item">
                    <h2 class="accordion-header" id="headingTwo">
                    <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseTwo" aria-expanded="false" aria-controls="collapseTwo">
                        Parte 2: Respuesta Libre
                    </button>
                    </h2>
                    <div id="collapseTwo" class="accordion-collapse collapse" aria-labelledby="headingTwo" data-bs-parent="#accordionExample">
                    <div class="accordion-body">
                        <strong>
                            <p>¿Qué carrera estudió Nathalie Otárola?</p>
                            <input autocomplete=off answer="answer" placeholder="Escribe tu respuesta aquí">
                            <button id="check">Confirm answer</button>
                            <p class="feedback"></p>
                        </strong>
                    </div>
                </div>
            <hr>
            <h3>Navegación del sitio</h3>
            <ol>
                <li><a href="index.html">Volver a la Homepage</a></li>
                <li><a href="experiencia.html">Experiencia Laboral</a></li>
                <li><a href="educacion.html">Antecedentes Académicos</a></li>
            </ol>
        </div>
    </body>
</html>
